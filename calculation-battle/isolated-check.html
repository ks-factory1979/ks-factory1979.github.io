<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex"><title>隔離環境の送信確認</title>
<style>body{font:18px system-ui;max-width:900px;margin:40px auto;padding:20px}button{font:inherit;padding:16px}pre{white-space:pre-wrap;background:#f1f4f8;padding:20px}</style>
<h1>隔離環境の送信確認</h1><p>管理者本人だけがアクセスできるテスト用GASへ架空記録を送信します。本番ゲームの保存先と端末ID・送信待ちには触れません。</p>
<button id="run">隔離環境で確認を実行</button><pre id="output">未実行</pre>
<script>
const HKB_CONFIG={gasWebAppUrl:'https://script.google.com/a/macros/oskedu.jp/s/AKfycby9IEqlYlZvStnw2FLFDJzcYOa-R7rCdEJfWBiqrOK3BlqAJGwuBi4uXmX2sUSObjWZ/exec'};
const state={screen:'title'};
function getDeviceId(){return 'test-bridge-device-20260916';}
</script>
<script src="gas-bridge-client.js"></script><script src="competition-service.js"></script>
<script>
document.getElementById('run').addEventListener('click',async()=>{
 const button=document.getElementById('run'),output=document.getElementById('output');
 button.disabled=true;const report={ok:false,checks:[],productionTouched:false};
 const show=()=>{output.textContent=JSON.stringify(report,null,2);};
 const check=(name,value)=>{if(!value)throw Error(name);report.checks.push(name);show();};
 const newService=()=>{const service=createHkbCompetitionService();service.queueKey='hkb-isolated-bridge-check-v1';service.applyResultState=result=>{service.lastAck=result;};return service;};
 let service=newService();
 try{
  const ping=await service.call('ping',{});
  check('隔離環境への接続',ping.ok&&ping.isolation==='hkb-migration-20260914');
  const bootstrap=await service.call('getAppBootstrap',{deviceId:getDeviceId()});
  check('起動データの取得',bootstrap.ok&&/^\d{4}-\d{2}$/.test(bootstrap.monthKey));
  const payload=(suffix,count)=>({playId:'test-bridge-'+bootstrap.monthKey+'-'+suffix,deviceId:getDeviceId(),monthKey:bootstrap.monthKey,playType:'official',cpuId:'lion',courseId:'all_challenge',characterId:'boy',matchSeconds:60,pausedUsed:false,interrupted:false,gentleEffects:false,correct:count,wrong:0,maxCombo:count,specialCount:0,finalRope:12,result:'player',events:Array.from({length:count},(_,i)=>({t:(i+1)*1000,r:1000,ok:true})),appVersion:'1.3.0-beta',rulesVersion:'lion-rules-3'});
  const first=payload('first',3);service.enqueue(first);
  const saved=await service.sendQueued(first);
  check('共有記録への保存と確認応答',saved.ok&&saved.saved&&saved.playId===first.playId);
  check('確認後の送信待ち削除',!service.queue().some(p=>p.playId===first.playId));
  const second=payload('reply-lost',4);service.enqueue(second);
  const originalCall=service.transport.call.bind(service.transport);
  service.transport.call=async(method,data)=>{const response=await originalCall(method,data);if(method==='submitOfficialResult')throw Error('[HKB_RETRY:TEST_RESPONSE_LOST]');return response;};
  let lost=false;try{await service.sendQueued(second);}catch(error){lost=String(error.message).includes('TEST_RESPONSE_LOST');}
  check('保存後に応答が失われても送信待ちを保持',lost&&service.queue().some(p=>p.playId===second.playId));
  service.transport.destroy();service=newService();
  check('作り直したサービスが同じIDと内容を復元',service.queue().some(p=>JSON.stringify(p)===JSON.stringify(second)));
  const pingAgain=await service.call('ping',{});check('再接続',pingAgain.isolation==='hkb-migration-20260914');
  await service.flushQueue();
  check('再送は重複応答となり送信待ちが解消',service.lastAck?.saved&&service.lastAck?.duplicate&&service.lastAck.playId===second.playId&&service.queue().length===0);
  const ghost=await service.call('getMonthlyGhost',{deviceId:getDeviceId(),courseId:'all_challenge'});
  check('王者更新後のゴーストを再取得',ghost.ok&&ghost.champion.correct===4&&ghost.ghost.events.length===4&&ghost.ghost.events.every((e,i)=>e.t===(i+1)*1000&&e.ok));
  report.ok=true;report.checkedAt=new Date().toISOString();report.playIds=[first.playId,second.playId];show();
 }catch(error){report.error=String(error.message||error);show();}
 finally{service.transport?.destroy();button.disabled=false;}
});
</script></html>
